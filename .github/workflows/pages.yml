name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Studio checkout that provides glyphs.js; its own CI drift-guards that file
  # against the pinned firmware. Bump deliberately, together with any glyph
  # regeneration, the same way Studio bumps its firmware sync index.
  STUDIO_REF: e526be2cb9a21b1780a5330da0b7e2573663cc6e

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: website
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Gangleri42/studio
          ref: ${{ env.STUDIO_REF }}
          path: seedhammer-studio
      - name: checks
        run: website/tools/check.sh
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
